name: Build PanVK Android Driver

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Cross-compile libvulkan_panfrost.so
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Host Build Dependencies
        run: |
          sudo apt-get purge -y needrestart || true
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            meson \
            ninja-build \
            glslang-tools \
            pkg-config \
            python3-mako \
            python3-packaging \
            python3-yaml \
            llvm-18-dev \
            libclang-18-dev \
            libclc-18-dev \
            libllvmspirvlib-18-dev \
            clang-18

          # Link LLVM 18 tools to standard names
          sudo ln -sf /usr/bin/llvm-config-18 /usr/bin/llvm-config
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Build PanVK Driver
        run: |
          set -o pipefail
          chmod +x build.sh
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "Using NDK: $ANDROID_NDK_HOME"
          ./build.sh "$ANDROID_NDK_HOME" 2>&1 | tee build.log

      - name: Publish Diagnostics to Step Summary
        if: always()
        run: |
          echo "## Build Diagnostics" >> $GITHUB_STEP_SUMMARY
          if [ -f build.log ]; then
            echo "### Last 60 lines of build.log:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 60 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 25 build.log | while IFS= read -r line; do
              echo "::error title=BuildLog::$line"
            done
          fi
          if [ -f build-host/meson-logs/meson-log.txt ]; then
            grep -i -C 2 "error:" build-host/meson-logs/meson-log.txt | tail -n 20 | while IFS= read -r line; do
              echo "::error title=HostMeson::$line"
            done
          fi
          if [ -f build-android/meson-logs/meson-log.txt ]; then
            grep -i -C 2 "error:" build-android/meson-logs/meson-log.txt | tail -n 20 | while IFS= read -r line; do
              echo "::error title=AndroidMeson::$line"
            done
          fi
          if [ -d dist ] && [ "$(ls -A dist)" ]; then
            echo "### Packaged Artifacts in dist/:" >> $GITHUB_STEP_SUMMARY
            ls -la dist >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload PanVK Driver Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: panvk-mali-driver
          path: dist/*
          if-no-files-found: error

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build.log
            build-host/meson-logs/meson-log.txt
            build-android/meson-logs/meson-log.txt
          if-no-files-found: ignore
